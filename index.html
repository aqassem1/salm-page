<style>
@font-face{font-family:Tajawal;font-weight:400 500;font-display:swap;src:url(fonts/tajawal_regular.ttf) format("truetype")}
@font-face{font-family:Tajawal;font-weight:700 900;font-display:swap;src:url(fonts/tajawal_bold.ttf) format("truetype")}
html,body{margin:0;height:100%;background:#070605;overscroll-behavior:none;-webkit-text-size-adjust:100%}
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none;user-drag:none;pointer-events:auto}
@media print{html{display:none!important}}
#gate{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:radial-gradient(90% 60% at 50% 18%,#3a2d0f 0,#120e06 45%,#050403 100%);padding:24px;overflow-y:auto;font-family:Tajawal,Tahoma,sans-serif;color:#f4ecd8}
#gate.on{display:flex}
.gi{width:min(100%,380px);display:grid;gap:12px;text-align:center}
.gl{width:128px;height:128px;margin:0 auto;filter:drop-shadow(0 0 28px rgba(212,175,55,.45))}
.gl img{width:100%;height:100%;display:block;border-radius:28px}
.ge{font-weight:800;letter-spacing:.5em;color:#a69c86;font-size:13px;padding-inline-start:.5em}
#gate h2{margin:10px 0 0;font-size:22px;font-weight:800;color:#f1d98a}
.pw{position:relative}
.pw input{width:100%;box-sizing:border-box;height:54px;border-radius:14px;padding:0 48px 0 16px;background:rgba(18,16,11,.9);border:1px solid #3b3323;color:#f4ecd8;font:inherit;font-size:16px;letter-spacing:2px;text-align:center}
.pw input:focus{border-color:#d4af37;outline:none;box-shadow:0 0 0 3px rgba(212,175,55,.18)}
.pw button{position:absolute;inset:0 auto 0 6px;width:42px;border:0;background:transparent;color:#a69c86}
.pw svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
#gm{min-height:20px;font-size:13px;font-weight:700;color:#e0736a}
#gg{height:54px;border:0;border-radius:14px;background:linear-gradient(135deg,#f1d98a,#d4af37);color:#0b0a08;font:inherit;font-weight:900;font-size:17px;box-shadow:0 8px 26px rgba(212,175,55,.28)}
#gg[disabled]{opacity:.6}
.shk{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
#shield{position:fixed;inset:0;z-index:100;background:#000;display:none;align-items:center;justify-content:center;color:#a69c86;font:700 15px Tajawal,Tahoma,sans-serif}
#shield.on{display:flex}
</style>
